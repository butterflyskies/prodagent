# Publish workspace crates to crates.io using Trusted Publishing (OIDC).
# Called by the release workflow after the draft release is created.
#
# Publish order: prodagent-types (lib, no deps) first, then agent-shell-parser
# (lib, depends on types), then agent-command-knowledge (lib, depends on
# parser + types), then agent-jj (binary). Each lib must be indexed by
# crates.io before its dependents can resolve.
name: Publish Crate

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth

      - name: Publish prodagent-types
        run: cargo publish -p prodagent-types --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for prodagent-types on crates.io
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Waiting for prodagent-types@${version} to appear on crates.io..."
          for i in $(seq 1 15); do
            if cargo search prodagent-types 2>/dev/null | grep -q "\"${version}\""; then
              echo "Found after ${i} attempts"
              break
            fi
            sleep 2
          done

      - name: Publish agent-shell-parser
        run: cargo publish -p agent-shell-parser --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for agent-shell-parser on crates.io
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Waiting for agent-shell-parser@${version} to appear on crates.io..."
          for i in $(seq 1 15); do
            if cargo search agent-shell-parser 2>/dev/null | grep -q "\"${version}\""; then
              echo "Found after ${i} attempts"
              break
            fi
            sleep 2
          done

      - name: Publish agent-command-knowledge
        run: cargo publish -p agent-command-knowledge --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for agent-command-knowledge on crates.io
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Waiting for agent-command-knowledge@${version} to appear on crates.io..."
          for i in $(seq 1 15); do
            if cargo search agent-command-knowledge 2>/dev/null | grep -q "\"${version}\""; then
              echo "Found after ${i} attempts"
              break
            fi
            sleep 2
          done

      - name: Publish agent-jj
        run: cargo publish -p agent-jj --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
