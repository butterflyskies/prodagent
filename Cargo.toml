[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.8.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/butterflyskies/prodagent"
rust-version = "1.93"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
shlex = "1"
camino = "1"
dirs = "6"
figment = { version = "0.10", features = ["toml"] }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
prodagent-types = { path = "crates/prodagent-types", version = "^0.8" }
agent-shell-parser = { path = "crates/agent-shell-parser", version = "^0.8" }
agent-command-knowledge = { path = "crates/agent-command-knowledge", version = "^0.8" }
agent-policy = { path = "crates/agent-policy", version = "^0.8" }
prodagent-config = { path = "crates/prodagent-config", version = "^0.8" }

[profile.release]
lto = true
strip = true
