[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/butterflyskies/prodagent"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
shlex = "1"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
agent-shell-parser = { path = "crates/agent-shell-parser", version = "^0.5" }

[profile.release]
lto = true
strip = true
