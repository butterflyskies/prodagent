[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/butterflyskies/prodagent"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
shell-words = "1"
agent-shell-parser = { path = "crates/agent-shell-parser", version = "^0.2" }

[profile.release]
lto = true
strip = true
